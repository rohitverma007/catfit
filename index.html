  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useCallback, useMemo, useContext, createContext } = React;

    // ============================================
    // DUMBPHONE KEYBOARD NAVIGATION SYSTEM
    // ============================================
    // Supports: D-pad (arrows), Enter (select), Back (escape/backspace), Number keys (1-4 for tabs)

    const KeyboardNavContext = createContext(null);

    // Hook for keyboard navigation
    function useKeyboardNav() {
      return useContext(KeyboardNavContext);
    }

    // Keyboard Navigation Provider Component
    function KeyboardNavProvider({ children, activeTab, setActiveTab, modals = {} }) {
      const [focusedIndex, setFocusedIndex] = useState(0);
      const [isKeyboardMode, setIsKeyboardMode] = useState(false);
      const containerRef = useRef(null);

      // Get all focusable elements in current view
      const getFocusableElements = useCallback(() => {
        if (!containerRef.current) return [];

        // Select all interactive elements
        const selector = [
          'button:not([disabled]):not([aria-hidden="true"])',
          'input:not([disabled]):not([type="hidden"])',
          'select:not([disabled])',
          'a[href]',
          '[tabindex]:not([tabindex="-1"])',
          '[data-nav]'
        ].join(', ');

        const elements = Array.from(containerRef.current.querySelectorAll(selector));

        // Filter out hidden elements
        return elements.filter(el => {
          const style = window.getComputedStyle(el);
          const rect = el.getBoundingClientRect();
          return style.display !== 'none' &&
                 style.visibility !== 'hidden' &&
                 rect.width > 0 &&
                 rect.height > 0 &&
                 !el.closest('[aria-hidden="true"]');
        });
      }, []);

      // Focus an element by index
      const focusElement = useCallback((index) => {
        const elements = getFocusableElements();
        if (elements.length === 0) return;

        const clampedIndex = Math.max(0, Math.min(index, elements.length - 1));
        setFocusedIndex(clampedIndex);

        const element = elements[clampedIndex];
        if (element) {
          element.focus({ preventScroll: false });
          element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }, [getFocusableElements]);

      // Navigate to next/previous element
      const navigate = useCallback((direction) => {
        const elements = getFocusableElements();
        if (elements.length === 0) return;

        const currentElement = document.activeElement;
        const currentIndex = elements.indexOf(currentElement);

        let newIndex;
        if (currentIndex === -1) {
          newIndex = 0;
        } else if (direction === 'next') {
          newIndex = (currentIndex + 1) % elements.length;
        } else if (direction === 'prev') {
          newIndex = (currentIndex - 1 + elements.length) % elements.length;
        } else if (direction === 'up' || direction === 'down') {
          // For up/down, find element in same column or closest vertically
          const currentRect = currentElement.getBoundingClientRect();
          const candidates = elements.filter((el, idx) => {
            if (idx === currentIndex) return false;
            const rect = el.getBoundingClientRect();
            const verticalMatch = direction === 'up'
              ? rect.bottom <= currentRect.top
              : rect.top >= currentRect.bottom;
            // Allow some horizontal tolerance
            const horizontalOverlap =
              (rect.left < currentRect.right + 50) &&
              (rect.right > currentRect.left - 50);
            return verticalMatch && horizontalOverlap;
          });

          if (candidates.length > 0) {
            // Find closest one
            candidates.sort((a, b) => {
              const aRect = a.getBoundingClientRect();
              const bRect = b.getBoundingClientRect();
              const aDist = Math.abs(aRect.top - currentRect.top);
              const bDist = Math.abs(bRect.top - currentRect.top);
              return aDist - bDist;
            });
            newIndex = elements.indexOf(candidates[0]);
          } else {
            // Fall back to linear navigation
            newIndex = direction === 'up'
              ? (currentIndex - 1 + elements.length) % elements.length
              : (currentIndex + 1) % elements.length;
          }
        } else if (direction === 'left' || direction === 'right') {
          // For left/right, find element in same row or closest horizontally
          const currentRect = currentElement.getBoundingClientRect();
          const candidates = elements.filter((el, idx) => {
            if (idx === currentIndex) return false;
            const rect = el.getBoundingClientRect();
            const horizontalMatch = direction === 'left'
              ? rect.right <= currentRect.left
              : rect.left >= currentRect.right;
            // Allow some vertical tolerance for same row
            const verticalOverlap =
              Math.abs(rect.top - currentRect.top) < currentRect.height;
            return horizontalMatch && verticalOverlap;
          });

          if (candidates.length > 0) {
            candidates.sort((a, b) => {
              const aRect = a.getBoundingClientRect();
              const bRect = b.getBoundingClientRect();
              const aDist = Math.abs(aRect.left - currentRect.left);
              const bDist = Math.abs(bRect.left - currentRect.left);
              return aDist - bDist;
            });
            newIndex = elements.indexOf(candidates[0]);
          } else {
            // Fall back to prev/next
            newIndex = direction === 'left'
              ? (currentIndex - 1 + elements.length) % elements.length
              : (currentIndex + 1) % elements.length;
          }
        }

        if (newIndex !== undefined) {
          focusElement(newIndex);
        }
      }, [getFocusableElements, focusElement]);

      // Tab switching
      const tabIds = ['cal', 'wgt', 'gym', 'set'];
      const switchTab = useCallback((tabIndex) => {
        if (tabIndex >= 0 && tabIndex < tabIds.length) {
          setActiveTab(tabIds[tabIndex]);
          // Focus first element in new tab after render
          setTimeout(() => focusElement(0), 100);
        }
      }, [setActiveTab, focusElement]);

      // Check if any modal is open
      const isModalOpen = useCallback(() => {
        return Object.values(modals).some(isOpen => isOpen);
      }, [modals]);

      // Handle keydown events
      useEffect(() => {
        const handleKeyDown = (e) => {
          // Enable keyboard mode on any key press
          if (!isKeyboardMode) {
            setIsKeyboardMode(true);
            document.body.classList.remove('using-mouse');
          }

          // Number keys 1-4 for tab switching (only when no modal is open)
          if (e.key >= '1' && e.key <= '4' && !isModalOpen() && !e.target.matches('input, textarea')) {
            e.preventDefault();
            switchTab(parseInt(e.key) - 1);
            return;
          }

          // Arrow key navigation (D-pad)
          if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault();
            const direction = e.key.replace('Arrow', '').toLowerCase();
            navigate(direction);
            return;
          }

          // Enter key - activate focused element
          if (e.key === 'Enter') {
            const activeEl = document.activeElement;
            if (activeEl && activeEl !== document.body) {
              // Don't prevent default for inputs/forms
              if (!activeEl.matches('input, textarea, select')) {
                e.preventDefault();
                activeEl.click();
              }
            }
            return;
          }

          // Escape or Backspace - close modals or go back

                  meals,
                  calorieGoal,
                  weightEntries,
                  goalWeight,
                  weightUnit,
                  gymSessions,
                  triSessions,
                  exportDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                const now = new Date();
                const dateStr = now.toISOString().split('T')[0];
                const timeStr = now.toTimeString().split(' ')[0].replace(/:/g, '-');
                a.download = `fitness-data-${dateStr}_${timeStr}.json`;
                a.click();
                URL.revokeObjectURL(url);
              }}
              className="w-full bg-blue-600 rounded-xl py-4 text-lg font-bold"
            >
              📤 Export Data (JSON)
            </button>
            
            {/* Import */}
            <label className="w-full bg-green-600 rounded-xl py-4 text-lg font-bold text-center block cursor-pointer">
              📥 Import Data (JSON)
              <input 
                type="file" 
                accept=".json"
                className="hidden"
                onChange={(e) => {
                  const file = e.target.files[0];
                  if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                      try {
                        // Limit file size (5MB max)
                        if (ev.target.result.length > 5 * 1024 * 1024) {
                          throw new Error('File too large (max 5MB)');
                        }

                        const data = JSON.parse(ev.target.result);

                        // Validate data is an object
                        if (typeof data !== 'object' || data === null || Array.isArray(data)) {
                          throw new Error('Invalid data format');
                        }

                        // Sanitize string helper
                        const sanitizeStr = (s, maxLen = 100) =>
                          typeof s === 'string' ? s.slice(0, maxLen).replace(/[<>]/g, '') : '';

                        // Validate and sanitize meals
                        if (data.meals && Array.isArray(data.meals)) {
                          const validMeals = data.meals.slice(0, 10000).filter(m =>
                            m && typeof m === 'object' &&
                            typeof m.id === 'string' &&
                            typeof m.name === 'string' &&
                            typeof m.calories === 'number' && m.calories >= 0 && m.calories <= 50000
                          ).map(m => ({
                            id: sanitizeStr(m.id, 50),
                            name: sanitizeStr(m.name, 100),
                            calories: Math.floor(m.calories),
                            date: sanitizeStr(m.date || '', 20)
                          }));
                          setMeals(validMeals);
                        }

                        // Validate calorieGoal
                        if (typeof data.calorieGoal === 'number' && data.calorieGoal >= 500 && data.calorieGoal <= 10000) {
                          setCalorieGoal(Math.floor(data.calorieGoal));
                        }

                        // Validate weightEntries
                        if (data.weightEntries && Array.isArray(data.weightEntries)) {
                          const validWeights = data.weightEntries.slice(0, 10000).filter(w =>
                            w && typeof w === 'object' &&
                            typeof w.id === 'string' &&
                            typeof w.weight === 'number' && w.weight >= 20 && w.weight <= 500
                          ).map(w => ({
                            id: sanitizeStr(w.id, 50),
                            weight: Number(w.weight.toFixed(2)),
                            date: sanitizeStr(w.date || '', 20)
                          }));
                          setWeightEntries(validWeights);
                        }

                        // Validate goalWeight
                        if (typeof data.goalWeight === 'number' && data.goalWeight >= 20 && data.goalWeight <= 500) {
                          setGoalWeight(Number(data.goalWeight.toFixed(2)));
                        }

                        // Validate weightUnit
                        if (data.weightUnit === 'kg' || data.weightUnit === 'lbs') {
                          setWeightUnit(data.weightUnit);
                        }

                        // Validate gymSessions (complex nested structure)
                        if (data.gymSessions && Array.isArray(data.gymSessions)) {
                          const validSessions = data.gymSessions.slice(0, 1000).filter(s =>
                            s && typeof s === 'object' &&
                            typeof s.id === 'string' &&
                            Array.isArray(s.exercises)
                          ).map(s => ({
                            id: sanitizeStr(s.id, 50),
                            date: sanitizeStr(s.date || '', 20),
                            time: sanitizeStr(s.time || '', 10),
                            duration: typeof s.duration === 'number' ? Math.min(Math.max(0, Math.floor(s.duration)), 600) : 0,
                            startTime: sanitizeStr(s.startTime || '', 30),
                            exercises: (s.exercises || []).slice(0, 50).filter(ex =>
                              ex && typeof ex === 'object' && typeof ex.name === 'string'
                            ).map(ex => ({
                              id: sanitizeStr(ex.id || Date.now().toString(), 50),
                              name: sanitizeStr(ex.name, 50),
                              sets: (ex.sets || []).slice(0, 100).filter(set =>
                                set && typeof set === 'object'
                              ).map(set => ({
                                id: sanitizeStr(set.id || Date.now().toString(), 50),
                                reps: typeof set.reps === 'number' ? Math.min(Math.max(0, Math.floor(set.reps)), 1000) : 0,
                                weight: typeof set.weight === 'number' ? Math.min(Math.max(0, set.weight), 1000) : 0,
                                duration: typeof set.duration === 'number' ? Math.min(Math.max(0, Math.floor(set.duration)), 600) : undefined,
                                calories: typeof set.calories === 'number' ? Math.min(Math.max(0, Math.floor(set.calories)), 10000) : undefined,
                                isCardio: set.isCardio === true
                              }))
                            }))
                          }));
                          setGymSessions(validSessions);
                        }

                        alert('Data imported successfully!');
                      } catch (err) {
                        alert('Error importing data: Invalid file format');
                      }
                    };
                    reader.readAsText(file);
                  }
                  e.target.value = '';
                }}
              />
            </label>
            
            {/* Clear Data */}
            <button 
              onClick={() => {
                if (confirm('Are you sure you want to delete ALL data? This cannot be undone!')) {
                  setMeals([]);
                  setWeightEntries([]);
                  setGymSessions([]);
                  setActiveWorkout(null);
                  localStorage.clear();
                  alert('All data cleared!');
                }
              }}
              className="w-full bg-red-600 rounded-xl py-4 text-lg font-bold"
            >
              🗑️ Clear All Data
            </button>

            {/* Strava Sync */}
            <div className="text-center text-gray-400 text-sm mt-4">Strava Sync</div>
            <div className="bg-gray-800 rounded-xl p-3 space-y-3">
              {stravaTokens ? (
                <>
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="text-sm font-bold text-orange-400">Connected to Strava</div>
                      {stravaAthlete && (
                        <div className="text-xs text-gray-400">{stravaAthlete.firstname} {stravaAthlete.lastname}</div>
                      )}
                      {stravaLastSync && (
                        <div className="text-xs text-gray-500">Last sync: {new Date(stravaLastSync).toLocaleString()}</div>
                      )}
                    </div>
                    <div className="w-3 h-3 bg-green-500 rounded-full" />
                  </div>
                  <button
                    onClick={stravaSyncActivities}
                    disabled={stravaSyncing}
                    className={`w-full rounded-xl py-3 font-bold ${stravaSyncing ? 'bg-gray-600 cursor-not-allowed' : 'bg-orange-600'}`}
                  >
                    {stravaSyncing ? 'Syncing...' : 'Sync Activities'}
                  </button>
                  <button
                    onClick={stravaDisconnect}
                    className="w-full bg-gray-700 rounded-xl py-2 text-sm text-gray-300"
                  >
                    Disconnect Strava
                  </button>
                </>
              ) : (
                <button
                  onClick={stravaConnect}
                  className="w-full bg-orange-600 rounded-xl py-4 text-lg font-bold"
                >
                  Connect to Strava
                </button>
              )}
              {stravaSyncResult && (
                <div className={`text-center text-sm py-1 rounded ${stravaSyncResult.ok ? 'text-green-400' : 'text-red-400'}`}>
                  {stravaSyncResult.message}
                </div>
              )}
              <div className="text-xs text-gray-500 text-center">
                Import your runs, rides, swims and workouts from Strava
              </div>
            </div>

            <div className="bg-gray-800 rounded-xl p-3 space-y-2">
              <div className="text-gray-400 text-sm text-center">Data Summary</div>
              <div className="grid grid-cols-2 gap-2 text-center">
                <div className="bg-gray-700 rounded-lg p-2">
                  <div className="text-xl font-bold text-orange-400">{meals.length}</div>
                  <div className="text-xs text-gray-400">meals logged</div>
                </div>
                <div className="bg-gray-700 rounded-lg p-2">
                  <div className="text-xl font-bold text-blue-400">{weightEntries.length}</div>
                  <div className="text-xs text-gray-400">weight entries</div>
                </div>
                <div className="bg-gray-700 rounded-lg p-2">
                  <div className="text-xl font-bold text-purple-400">{gymSessions.length}</div>
                  <div className="text-xs text-gray-400">workouts</div>
                </div>
                <div className="bg-gray-700 rounded-lg p-2">
                  <div className="text-xl font-bold text-green-400">{gymSessions.reduce((s, g) => s + g.exercises.reduce((es, ex) => es + ex.sets.length, 0), 0)}</div>
                  <div className="text-xs text-gray-400">total sets</div>
                </div>
              </div>
            </div>
            
            {/* Dashboard Link */}
            <a
              href="./dashboard.html"
              className="w-full bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl py-4 text-lg font-bold text-center block"
            >
              📊 Open Analytics Dashboard
            </a>

            <div className="bg-gray-800 rounded-xl p-3">
              <div className="text-gray-400 text-sm text-center mb-2">About</div>
              <div className="text-center text-xs text-gray-500">
                Fitness Tracker v1.0<br/>
                Built for Cat S22 Flip<br/>
                Data stored locally<br/>
                Built by <a href="https://vayuapps.com" target="_blank" rel="noopener noreferrer" className="text-blue-400 underline">vayuapps.com</a>
              </div>
            </div>
          </div>
        )}
      </main>

      {/* Strava Push Modal */}
      {stravaPushModal && (
        <div className="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4">
          <div className="bg-gray-900 rounded-2xl w-full max-w-sm p-4 space-y-3">
            <div className="text-center font-bold text-lg">Push to Strava</div>
            <div className="text-center text-xs text-gray-400">
              {stravaPushModal.date} • {stravaPushModal.duration}min • {stravaPushModal.exercises.length} exercise{stravaPushModal.exercises.length !== 1 ? 's' : ''}
            </div>

            <div>
              <label className="text-xs text-gray-400 block mb-1">Activity Name</label>
              <input
                type="text"
                value={stravaPushName}
                onChange={(e) => setStravaPushName(e.target.value)}
                maxLength={200}
                className="w-full bg-gray-800 rounded-lg px-3 py-2 text-white outline-none focus:ring-2 focus:ring-orange-500"
              />
            </div>

            <div>
              <label className="text-xs text-gray-400 block mb-1">Sport Type</label>
              <div className="grid grid-cols-3 gap-1">
                {stravaSportTypes.map(t => (
                  <button
                    key={t}
                    onClick={() => setStravaPushSport(t)}
                    className={`py-2 rounded-lg text-xs font-bold ${stravaPushSport === t ? 'bg-orange-600' : 'bg-gray-800'}`}
                  >{t.replace(/([A-Z])/g, ' $1').trim()}</button>
                ))}
              </div>
            </div>

            {stravaPushResult && (
              <div className={`text-center text-sm py-1 ${stravaPushResult.ok ? 'text-green-400' : 'text-red-400'}`}>
                {stravaPushResult.message}
              </div>
            )}

            <div className="grid grid-cols-2 gap-2">
              <button
                onClick={() => { setStravaPushModal(null); setStravaPushResult(null); }}
                className="bg-gray-700 rounded-xl py-3 font-bold"
              >Cancel</button>
              <button
                onClick={stravaPushWorkout}
                disabled={stravaPushing === stravaPushModal.id}
                className={`rounded-xl py-3 font-bold ${stravaPushing === stravaPushModal.id ? 'bg-gray-600 cursor-not-allowed' : 'bg-orange-600'}`}
              >{stravaPushing === stravaPushModal.id ? 'Pushing...' : 'Push'}</button>
            </div>
          </div>
        </div>
      )}

      {/* Navigation hint bar for dumbphone users */}
      <NavHintBar showTabHints={!showAddMeal && !showAddWeight && !showExercisePicker && !viewingSession} />
    </div>
    </KeyboardNavProvider>
  );
}

      // Find the component to render
      const ComponentToRender = typeof __Component__ !== 'undefined'
        ? __Component__
        : typeof App !== 'undefined'
          ? App
          : typeof Component !== 'undefined'
            ? Component
            : null;

      if (ComponentToRender) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
          React.createElement(ErrorBoundary, null,
            React.createElement(ComponentToRender)
          )
        );
      } else {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-display';
        errorDiv.textContent = 'No component found to render. Make sure to export default your component.';
        document.getElementById('root').replaceChildren(errorDiv);
      }
    } catch (err) {
      const errorDiv = document.createElement('div');
      errorDiv.className = 'error-display';
      errorDiv.textContent = 'Error: ' + (err.message || 'Unknown error');
      document.getElementById('root').replaceChildren(errorDiv);
    }
  </script>
</body>
</html>
